services:
  backend:
    build: ./Mealio.Server
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000

  frontend:
    build:
      context: ./mealio.client
      args:
        DOCKER: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - DOCKER=true
      - DEV_SERVER_PORT=5173
    volumes:
      - ./mealio.client:/app
      - /app/node_modules
    command: npm run dev -- --host
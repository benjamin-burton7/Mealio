name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend dependencies
        run: dotnet restore Mealio.Tests/Mealio.Tests.csproj

      - name: Build backend
        run: dotnet build Mealio.Tests/Mealio.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Mealio.Tests/Mealio.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mealio.client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mealio.client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build